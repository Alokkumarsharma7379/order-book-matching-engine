services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://orderbook:${POSTGRES_PASSWORD:-orderbook_dev}@postgres:5432/orderbook
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: orderbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderbook_dev}
      POSTGRES_DB: orderbook
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderbook -d orderbook"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  pgdata:
